<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Currency Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Layered Background -->
    <div class="bg">
      <div class="bg-blob b1"></div>
      <div class="bg-blob b2"></div>
      <div class="bg-blob b3"></div>
      <div class="bg-grid"></div>
    </div>

    <div class="page">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6l4 2" />
            </svg>
          </div>
          <span class="brand-name">Currency Converter</span>
        </div>
        <div class="live-badge">
          <span class="live-dot"></span>
          Live Rates
        </div>
      </header>

      <!-- Hero label -->
      <div class="hero">
        <h1 class="hero-title">
          Convert <span class="hero-accent">currencies</span><br />instantly.
        </h1>
        <p class="hero-sub" id="last-updated">Fetching live exchange rates…</p>
      </div>

      <!-- Main converter card -->
      <div class="card">
        <!-- Amount -->
        <div class="input-block">
          <label class="lbl">You send</label>
          <div class="amount-row">
            <div
              class="currency-pill from-pill"
              id="from-btn"
              tabindex="0"
              role="button"
              aria-expanded="false"
            >
              <img class="pill-flag" id="from-flag" src="" alt="" width="26" />
              <span class="pill-code" id="from-code">USD</span>
              <svg
                class="pill-caret"
                id="from-caret"
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              >
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
            <input
              type="number"
              id="amount"
              value="1"
              min="0"
              step="any"
              class="amount-input"
              placeholder="0.00"
              autocomplete="off"
              inputmode="decimal"
            />
          </div>
          <!-- From dropdown -->
          <div class="dropdown" id="from-dropdown">
            <div class="dd-search-row">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="text"
                id="from-search"
                class="dd-search"
                placeholder="Search…"
                autocomplete="off"
              />
            </div>
            <ul class="dd-list" id="from-list"></ul>
          </div>
        </div>

        <!-- Swap -->
        <div class="swap-row">
          <div class="swap-line"></div>
          <button class="swap-btn" id="swap-btn" aria-label="Swap currencies">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path d="M7 16V4m0 0L3 8m4-4l4 4" />
              <path d="M17 8v12m0 0l4-4m-4 4l-4-4" />
            </svg>
          </button>
          <div class="swap-line"></div>
        </div>

        <!-- To -->
        <div class="input-block">
          <label class="lbl">You receive</label>
          <div class="amount-row">
            <div
              class="currency-pill to-pill"
              id="to-btn"
              tabindex="0"
              role="button"
              aria-expanded="false"
            >
              <img class="pill-flag" id="to-flag" src="" alt="" width="26" />
              <span class="pill-code" id="to-code">EUR</span>
              <svg
                class="pill-caret"
                id="to-caret"
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              >
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
            <div class="result-display" id="result-display">—</div>
          </div>
          <!-- To dropdown -->
          <div class="dropdown" id="to-dropdown">
            <div class="dd-search-row">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="text"
                id="to-search"
                class="dd-search"
                placeholder="Search…"
                autocomplete="off"
              />
            </div>
            <ul class="dd-list" id="to-list"></ul>
          </div>
        </div>

        <!-- Rate strip -->
        <div class="rate-strip" id="rate-strip">
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          <span id="rate-text">Waiting for conversion…</span>
        </div>
      </div>
      <!-- /card -->

      <!-- Convert CTA -->
      <button class="cta-btn" id="convert-btn">
        <span class="cta-text">Get Rate</span>
        <div class="cta-loader" id="cta-loader">
          <span></span><span></span><span></span>
        </div>
        <svg
          class="cta-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </button>

      <p class="footer-note">
        Rates sourced from open.er-api.com · Updated every 24h
      </p>
    </div>
    <!-- /page -->

    <script src="app.js"></script>
  </body>
</html>
