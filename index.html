<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Currency Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <!-- HEADER -->
      <header class="header">
        <div class="brand">
          <div class="brand-icon">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="1" x2="12" y2="23" />
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
            </svg>
          </div>
          <div class="brand-title">
            <span class="brand-name">Currency Converter</span>
            <span class="brand-sub">Real-time exchange rates</span>
          </div>
        </div>
        <div
          class="live-badge"
          title="Exchange rates are live and updated every 24 hours"
        >
          <span class="live-dot"></span>
          <span class="live-text" id="live-lbl">Live</span>
        </div>
      </header>

      <!-- CARD -->
      <div class="card">
        <!-- YOU SEND -->
        <div class="panel" id="panel-from">
          <div class="panel-top">
            <span class="panel-label send-label">
              <svg
                width="11"
                height="11"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
              You Send
            </span>
            <button
              class="cur-selector"
              id="from-btn"
              aria-expanded="false"
              aria-label="Select currency to send"
              title="Click to choose the currency you want to send"
            >
              <img
                class="cur-flag"
                id="from-flag"
                src=""
                alt="USD"
                width="28"
                height="19"
                title="Currency flag"
              />
              <span class="cur-code" id="from-code">USD</span>
              <span class="cur-name" id="from-name">United States</span>
              <svg
                class="cur-arrow"
                id="from-arrow"
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                title="Click to open currency list"
              >
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </button>
          </div>
          <input
            id="amount"
            type="number"
            class="num-field"
            value="1"
            min="0"
            step="any"
            autocomplete="off"
            inputmode="decimal"
            placeholder="0"
            title="Type the amount you want to convert"
          />
          <span class="field-currency" id="from-cur-label">US Dollar</span>

          <!-- FROM dropdown -->
          <div class="dropdown" id="from-dd">
            <div class="dd-head">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="text"
                id="from-search"
                class="dd-search"
                placeholder="Search by name or country…"
                autocomplete="off"
              />
            </div>
            <ul class="dd-list" id="from-list"></ul>
          </div>
        </div>

        <!-- SWAP -->
        <div class="swap-row">
          <div class="swap-divider"></div>
          <button
            class="swap-btn"
            id="swap-btn"
            aria-label="Swap currencies"
            title="Swap — switch the two currencies"
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="17 1 21 5 17 9" />
              <path d="M3 11V9a4 4 0 0 1 4-4h14" />
              <polyline points="7 23 3 19 7 15" />
              <path d="M21 13v2a4 4 0 0 1-4 4H3" />
            </svg>
          </button>
          <div class="swap-divider"></div>
        </div>

        <!-- YOU RECEIVE -->
        <div class="panel panel-receive" id="panel-to">
          <div class="panel-top">
            <span class="panel-label recv-label">
              <svg
                width="11"
                height="11"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                <polyline points="17 6 23 6 23 12" />
              </svg>
              You Receive
            </span>
            <button
              class="cur-selector cur-selector-recv"
              id="to-btn"
              aria-expanded="false"
              aria-label="Select currency to receive"
              title="Click to choose the currency you want to receive"
            >
              <img
                class="cur-flag"
                id="to-flag"
                src=""
                alt="EUR"
                width="28"
                height="19"
              />
              <span class="cur-code" id="to-code">EUR</span>
              <span class="cur-name" id="to-name">European Union</span>
              <svg
                class="cur-arrow"
                id="to-arrow"
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </button>
          </div>
          <div class="result-field-wrap">
            <input
              id="result"
              type="number"
              class="num-field result-field"
              placeholder="0"
              autocomplete="off"
              inputmode="decimal"
              title="Converted amount — you can also type here to convert backwards"
            />
            <div class="spinner hidden" id="spinner"></div>
          </div>
          <span class="field-currency recv-currency" id="to-cur-label"
            >Euro</span
          >

          <!-- TO dropdown -->
          <div class="dropdown" id="to-dd">
            <div class="dd-head">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="text"
                id="to-search"
                class="dd-search"
                placeholder="Search by name or country…"
                autocomplete="off"
              />
            </div>
            <ul class="dd-list" id="to-list"></ul>
          </div>
        </div>

        <!-- RATE BAR -->
        <div
          class="rate-bar"
          title="Current exchange rate between the two selected currencies"
        >
          <div class="rate-left">
            <span class="rate-label">Exchange Rate</span>
            <span class="rate-val" id="rate-val">Loading…</span>
          </div>
          <span class="rate-date" id="rate-date">—</span>
        </div>
      </div>
      <!-- /card -->

      <!-- SOCIALS -->
      <div class="socials">
        <a
          href="https://facebook.com/shawnazd"
          target="_blank"
          rel="noopener"
          class="soc soc-fb"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"
            />
          </svg>
          shawnazd
        </a>
        <div class="soc-div"></div>
        <a
          href="https://github.com/shawnazd"
          target="_blank"
          rel="noopener"
          class="soc soc-gh"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
            />
          </svg>
          shawnazd
        </a>
      </div>

      <p class="foot">Powered by open.er-api.com · Rates updated every 24h</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
